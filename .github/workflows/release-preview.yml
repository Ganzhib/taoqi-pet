name: Publish unsigned preview

# 预览版发布工作流。跟 release.yml 用同一套版本号读法：
# 1. 触发前先把 package.json 的 version 改成 v0.3.0-preview.4（举例）
# 2. 工作流从 version 字段读出整个 tag，避免硬编码
# 3. 产物名里嵌的预览后缀会自动跟着走

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taoqi-pet-preview-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read version from package.json
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Prepare draft release
        env:
          TAG: v${{ steps.v.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "淘气桌宠 $TAG" \
              --notes-file "docs/releases/$TAG.md"
          fi

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build:ui
      - name: Build and upload preview assets
        run: npx electron-builder --${{ matrix.platform }} --publish always

  publish:
    # prepare 必须直接列进 needs：needs.<job>.outputs 只对直接依赖求值
    needs: [prepare, package]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify update manifests and publish release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          grep -Fx 'preview.yml' "$RUNNER_TEMP/assets.txt"
          grep -Fx 'preview-mac.yml' "$RUNNER_TEMP/assets.txt"
          grep -Fx "taoqi-pet-setup-$VERSION-win-x64.exe" "$RUNNER_TEMP/assets.txt"
          grep -Fx "taoqi-pet-portable-$VERSION-win-x64.exe" "$RUNNER_TEMP/assets.txt"
          grep -Fx "taoqi-pet-$VERSION-mac-arm64.dmg" "$RUNNER_TEMP/assets.txt"
          grep -Fx "taoqi-pet-$VERSION-mac-x64.dmg" "$RUNNER_TEMP/assets.txt"
          gh release edit "$TAG" --draft=false --prerelease \
            --title "淘气桌宠 $TAG" \
            --notes-file "docs/releases/$TAG.md"
