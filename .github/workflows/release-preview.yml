name: Publish unsigned preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run dist -- --${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: taoqi-preview-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.2.0-preview.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: taoqi-preview-*
          path: release-assets
      - name: Publish preview release
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} < 4 )); then
            echo "Expected Windows and macOS packages."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "淘气桌宠 v0.2.0 预览版" \
              --notes-file docs/releases/v0.2.0-preview.1.md \
              --prerelease
          fi
