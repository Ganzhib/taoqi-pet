name: Deploy download website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taoqi-pet-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://pet.ganzhibin.icu/
    env:
      SITE_HOST: 150.158.27.165
      SITE_USER: root
      SITE_SSH_PRIVATE_KEY: ${{ secrets.SITE_SSH_PRIVATE_KEY }}
      SITE_SSH_KNOWN_HOSTS: ${{ secrets.SITE_SSH_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@v4

      - name: Assemble website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/taoqi-site/media"
          cp site/index.html site/styles.css site/main.js "$RUNNER_TEMP/taoqi-site/"
          cp assets/pets/*-idle.gif "$RUNNER_TEMP/taoqi-site/media/"
          cp assets/brand/gugugaga-avatar.png "$RUNNER_TEMP/taoqi-site/media/"
          test "$(find "$RUNNER_TEMP/taoqi-site/media" -name '*-idle.gif' | wc -l)" -eq 8
          tar -C "$RUNNER_TEMP/taoqi-site" -czf "$RUNNER_TEMP/taoqi-site.tar.gz" .

      - name: Configure independent SSH key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SITE_SSH_PRIVATE_KEY" || { echo "Set SITE_SSH_PRIVATE_KEY in the production environment"; exit 1; }
          test -n "$SITE_SSH_KNOWN_HOSTS" || { echo "Set SITE_SSH_KNOWN_HOSTS in the production environment"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SITE_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/taoqi_site_key
          printf '%s\n' "$SITE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/taoqi_site_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/taoqi_site_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "$SITE_USER@$SITE_HOST" true

      - name: Upload website archive
        shell: bash
        run: |
          set -euo pipefail
          ssh_options="-i $HOME/.ssh/taoqi_site_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3"
          timeout 1200 scp $ssh_options "$RUNNER_TEMP/taoqi-site.tar.gz" \
            "$SITE_USER@$SITE_HOST:/tmp/taoqi-site-$GITHUB_RUN_ID.tar.gz"
          ssh $ssh_options "$SITE_USER@$SITE_HOST" \
            "install -d -m 755 /var/www/taoqi-pet/releases/$GITHUB_SHA && tar -xzf /tmp/taoqi-site-$GITHUB_RUN_ID.tar.gz -C /var/www/taoqi-pet/releases/$GITHUB_SHA && rm -f /tmp/taoqi-site-$GITHUB_RUN_ID.tar.gz && ln -sfn releases/$GITHUB_SHA /var/www/taoqi-pet/current.next && mv -Tf /var/www/taoqi-pet/current.next /var/www/taoqi-pet/current"

      - name: Configure isolated Nginx vhost and HTTPS
        shell: bash
        run: |
          set -euo pipefail
          ssh_options="-i $HOME/.ssh/taoqi_site_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3"
          ssh $ssh_options "$SITE_USER@$SITE_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          domain=pet.ganzhibin.icu
          config="/etc/nginx/sites-available/$domain"
          cat > "$config" <<'NGINX'
          server {
              listen 80;
              server_name pet.ganzhibin.icu;
              root /var/www/taoqi-pet/current;
              index index.html;

              location /.well-known/acme-challenge/ {
                  try_files $uri =404;
              }

              location / {
                  try_files $uri $uri/ =404;
              }
          }
          NGINX
          ln -sfn "$config" "/etc/nginx/sites-enabled/$domain"
          nginx -t
          systemctl reload nginx
          if ! test -s "/etc/letsencrypt/live/$domain/fullchain.pem"; then
            certbot certonly --webroot --webroot-path /var/www/taoqi-pet/current \
              -d "$domain" --non-interactive --agree-tos -m luli_0819@qq.com
          fi
          cat > "$config" <<'NGINX'
          server {
              listen 80;
              server_name pet.ganzhibin.icu;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name pet.ganzhibin.icu;
              root /var/www/taoqi-pet/current;
              index index.html;
              ssl_certificate /etc/letsencrypt/live/pet.ganzhibin.icu/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/pet.ganzhibin.icu/privkey.pem;

              location / {
                  try_files $uri $uri/ =404;
              }
          }
          NGINX
          nginx -t
          systemctl reload nginx
          REMOTE

      - name: Verify HTTPS page and GIF
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://pet.ganzhibin.icu/ -o "$RUNNER_TEMP/index.html"
          grep -q '淘气桌宠' "$RUNNER_TEMP/index.html"
          curl --fail --silent --show-error https://pet.ganzhibin.icu/media/gugugaga-idle.gif \
            -o "$RUNNER_TEMP/gugugaga-idle.gif"
          test "$(head -c 6 "$RUNNER_TEMP/gugugaga-idle.gif")" = GIF89a
