name: Publish download site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - assets/pets/**
      - assets/icon.png
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: taoqi-pet-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble download site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/media
          cp site/index.html site/styles.css site/main.js _site/
          cp assets/icon.png _site/media/icon.png
          cp assets/pets/cat-*.gif _site/media/
          test "$(find _site/media -name 'cat-*.gif' | wc -l)" -eq 8
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
