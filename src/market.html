<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>淘气宠物市场</title>
  <link rel="stylesheet" href="./market.css">
</head>
<body>
  <header class="hero">
    <div class="hero-copy">
      <span class="eyebrow">TAOQI PET MARKET</span>
      <h1>换个小伙伴，换种好心情</h1>
      <p>原创角色、免费装扮，也欢迎带自己的图片来。</p>
      <span class="free-badge">全部免费 · 无账号 · 无付费解锁</span>
    </div>
    <button id="import-pet" class="import-button" type="button">＋ 导入我的宠物</button>
  </header>
  <main>
    <nav class="filters" aria-label="宠物分类">
      <button type="button" data-category="全部" aria-pressed="true">全部</button>
      <button type="button" data-category="日常陪伴" aria-pressed="false">日常陪伴</button>
      <button type="button" data-category="动漫感" aria-pressed="false">动漫感</button>
      <button type="button" data-category="搞笑梗" aria-pressed="false">搞笑梗</button>
      <button type="button" data-category="我的创作" aria-pressed="false">我的创作</button>
    </nav>
    <p id="status" class="status" role="status"></p>
    <section id="pet-grid" class="pet-grid" aria-label="宠物列表"></section>
  </main>
  <footer>导入 PNG、JPG、GIF 或 WebP 图片，单张不超过 5 MB。图片只保存在这台电脑上。</footer>
  <script src="./market.js"></script>
</body>
</html>
